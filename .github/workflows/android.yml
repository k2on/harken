# The Android build, built by nix.
#
# A branch push builds the development APK. The `Run workflow` button and a
# `v*` tag build the release one, which differs by a single gradle task.
#
# One job, on an x86_64 runner, which is worth saying plainly: everything Google
# publishes for Android is a `linux-x86_64` binary. Building this on the ARM
# machine it is developed on works — `binfmt_misc` and qemu see to that, and
# `CLAUDE.md` records what it costs — but here none of that applies and the
# toolchain simply runs.
#
# `nix build .#apk` rather than a sequence of steps, so that what CI builds and
# what a laptop builds are the same expression rather than two descriptions of
# one intention. The derivation is impure — gradle resolves its own dependency
# graph from Maven and there is no lockfile to vendor it from — so the sandbox
# is relaxed for it. Everything else is pinned: the Rust toolchain, every crate,
# every npm package, the SDK, the NDK, CMake and gradle.
name: android

on:
  push:
    branches: ["**"]
    # A version tag is a release build. Nothing else about the job changes:
    # same expression, same toolchain, one different gradle task.
    tags: ["v*"]
  pull_request:
  workflow_dispatch:
    inputs:
      variant:
        description: Which build to make
        type: choice
        options: [debug, release]
        default: debug

# A push supersedes the push before it, and a release build supersedes the
# release build before it — but a release build and a branch build are not the
# same work and must not cancel each other, which they did when the group was
# the ref alone: pressing the button killed the branch's build. `inputs.variant`
# is empty for anything that is not the button, so a push groups by event alone.
concurrency:
  group: android-${{ github.ref }}-${{ github.event_name }}-${{ inputs.variant }}
  cancel-in-progress: true

jobs:
  apk:
    runs-on: ubuntu-latest

    # The button decides when it is pressed, a `v*` tag decides by existing, and
    # everything else is the development build — which is what a branch push
    # wants and what every run before this one made.
    env:
      VARIANT: ${{ inputs.variant || (startsWith(github.ref, 'refs/tags/v') && 'release') || 'debug' }}

    steps:
      - uses: actions/checkout@v4

      - uses: DeterminateSystems/nix-installer-action@main
        with:
          # The APK derivation needs the network. `relaxed` lets a derivation
          # that asks for it — `__noChroot` — have it, and leaves every other
          # derivation sandboxed as usual.
          extra-conf: |
            sandbox = relaxed

      # The store is the expensive thing here: the NDK alone is over a gigabyte,
      # and the crates and npm packages are thousands of small fetches. Caching
      # it turns a cold twenty-minute setup into a warm one.
      #
      # Restore and save are separate steps on purpose. The combined action
      # saves from a post step declared `post-if: success()`, and every run of
      # this workflow so far has failed — so nothing was ever written and every
      # run started cold, including the ones whose failure had nothing to do
      # with the store. `if: always()` saves what the run downloaded whatever
      # the build did with it, which is exactly the run that needs it next time.
      - uses: nix-community/cache-nix-action/restore@v6
        with:
          primary-key: nix-${{ runner.os }}-${{ hashFiles('flake.lock', 'Cargo.lock', 'clients/expo/bun.lock') }}
          restore-prefixes-first-match: nix-${{ runner.os }}-

      # Cargo's own incremental state, which the nix cache above does *not*
      # cover and cannot: nix caches derivation outputs, keyed on their inputs,
      # all or nothing. `just` runs cargo inside a devshell rather than inside a
      # derivation, so nix never sees it — and wrapping it in one would not help
      # either, because the source changes on every commit and the derivation
      # would rebuild every time. What makes clippy and the tests fast is
      # `target/` surviving between runs, which is this.
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: ". -> target"
          # Same reason: its post step is `success() || CACHE_ON_FAILURE`, and
          # a run that fails in the APK step has still done the compiling this
          # is here to keep.
          cache-on-failure: true
          # The engine is a git dependency, so it lands in the cargo registry
          # rather than the workspace and is worth keeping too.
          cache-all-crates: true

      # The cheap check first, so a Rust mistake fails in a minute rather than
      # after the Android toolchain has had its say. It is `just` — fmt, clippy
      # and the suite — which is what a contributor runs.
      - name: fmt, clippy and the suite
        run: nix develop --command just

      - name: Build the APK
        run: nix build .#apk-$VARIANT --print-build-logs

      - uses: actions/upload-artifact@v4
        with:
          name: harken-android-${{ env.VARIANT }}
          path: result/*.apk
          if-no-files-found: error

      - uses: nix-community/cache-nix-action/save@v6
        if: always()
        with:
          primary-key: nix-${{ runner.os }}-${{ hashFiles('flake.lock', 'Cargo.lock', 'clients/expo/bun.lock') }}
          gc-max-store-size-linux: 8G
          purge: true
          purge-prefixes: nix-${{ runner.os }}-
          purge-created: 0
          purge-primary-key: never
