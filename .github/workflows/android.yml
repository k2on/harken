# The Android build, built by nix.
#
# A branch push builds the development APK. The `Run workflow` button and a
# `v*` tag build the release one, which differs by a single gradle task.
#
# One job, on an x86_64 runner, which is worth saying plainly: everything Google
# publishes for Android is a `linux-x86_64` binary. Building this on the ARM
# machine it is developed on works — `binfmt_misc` and qemu see to that, and
# `CLAUDE.md` records what it costs — but here none of that applies and the
# toolchain simply runs.
#
# `nix build .#apk` rather than a sequence of steps, so that what CI builds and
# what a laptop builds are the same expression rather than two descriptions of
# one intention. The derivation is impure — gradle resolves its own dependency
# graph from Maven and there is no lockfile to vendor it from — so the sandbox
# is relaxed for it. Everything else is pinned: the Rust toolchain, every crate,
# every npm package, the SDK, the NDK, CMake and gradle.
name: android

on:
  push:
    branches: ["**"]
    # A version tag is a release build. Nothing else about the job changes:
    # same expression, same toolchain, one different gradle task.
    tags: ["v*"]
  pull_request:
  workflow_dispatch:
    inputs:
      variant:
        description: Which build to make
        type: choice
        options: [debug, release]
        default: debug

# A push supersedes the push before it, and a release build supersedes the
# release build before it — but a release build and a branch build are not the
# same work and must not cancel each other, which they did when the group was
# the ref alone: pressing the button killed the branch's build. `inputs.variant`
# is empty for anything that is not the button, so a push groups by event alone.
concurrency:
  group: android-${{ github.ref }}-${{ github.event_name }}-${{ inputs.variant }}
  cancel-in-progress: true

jobs:
  apk:
    runs-on: ubuntu-latest

    # `actions: write` is what lets the cache purge below delete anything. Run
    # 14 tried and logged "Failed to delete the cache", so the store caches were
    # accumulating while the one being kept was the wrong one.
    permissions:
      # `contents: write` to publish a release on a tag, `actions: write` so the
      # cache purge below can delete anything.
      contents: write
      actions: write

    # The button decides when it is pressed, a `v*` tag decides by existing, and
    # everything else is the development build — which is what a branch push
    # wants and what every run before this one made.
    env:
      VARIANT: ${{ inputs.variant || (startsWith(github.ref, 'refs/tags/v') && 'release') || 'debug' }}

    steps:
      - uses: actions/checkout@v4

      - uses: DeterminateSystems/nix-installer-action@main
        with:
          # The APK derivation needs the network. `relaxed` lets a derivation
          # that asks for it — `__noChroot` — have it, and leaves every other
          # derivation sandboxed as usual.
          extra-conf: |
            sandbox = relaxed

      # The store is the expensive thing here: the NDK alone is over a gigabyte,
      # and the crates and npm packages are thousands of small fetches. Caching
      # it turns a cold twenty-minute setup into a warm one.
      #
      # Restore and save are separate steps because the combined action saves
      # from a post step declared `post-if: success()` — and a run that fails in
      # the APK step has still done the downloading this exists to keep.
      #
      # The run id is in the key because a GitHub cache key is immutable:
      # whoever writes it first owns it until it expires. A run cancelled ninety
      # seconds in wrote an 89MB empty store under the shared key, and every run
      # after it "restored" that and none could replace it. A key per run cannot
      # be squatted; the prefixes are what make it reusable, preferring the
      # newest run with this lockfile and falling back to any run at all.
      - uses: nix-community/cache-nix-action/restore@v6
        id: nix-store-cache
        with:
          primary-key: nix-${{ runner.os }}-${{ hashFiles('flake.lock', 'Cargo.lock', 'clients/expo/bun.lock') }}-${{ github.run_id }}
          restore-prefixes-first-match: |
            nix-${{ runner.os }}-${{ hashFiles('flake.lock', 'Cargo.lock', 'clients/expo/bun.lock') }}-
            nix-${{ runner.os }}-

      # Cargo's own incremental state, which the nix cache above does *not*
      # cover and cannot: nix caches derivation outputs, keyed on their inputs,
      # all or nothing. `just` runs cargo inside a devshell rather than inside a
      # derivation, so nix never sees it — and wrapping it in one would not help
      # either, because the source changes on every commit and the derivation
      # would rebuild every time. What makes clippy and the tests fast is
      # `target/` surviving between runs, which is this.
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: ". -> target"
          # Same reason: its post step is `success() || CACHE_ON_FAILURE`, and
          # a run that fails in the APK step has still done the compiling this
          # is here to keep.
          cache-on-failure: true
          # The engine is a git dependency, so it lands in the cargo registry
          # rather than the workspace and is worth keeping too.
          cache-all-crates: true

      # The cheap check first, so a Rust mistake fails in a minute rather than
      # after the Android toolchain has had its say. It is `just` — fmt, clippy
      # and the suite — which is what a contributor runs.
      - name: fmt, clippy and the suite
        run: nix develop --command just

      # …and then put `Cargo.lock` back, because running cargo changed it.
      #
      # The committed lockfile records the engine as a *path*, which is what the
      # gitignored `.cargo/config.toml` patch shapes it into. CI has no such
      # patch, so `just` resolves the engine from git and rewrites those seven
      # entries into git sources. `nix build` below reads the working tree —
      # dirty file and all — and installs the patch over it, and cargo cannot
      # satisfy a git-source lock through a path patch: it wants to re-resolve,
      # and `cargo vendor --locked` refuses to let it.
      #
      #   the lock file …/harken-workspace/Cargo.lock needs to be updated
      #   but --locked was passed to prevent this
      #
      # Runs 22-26 only reached this because the vendor derivation is
      # fixed-output: while its hash was unchanged the store cache answered for
      # it and cargo never ran. The rewrite is not new, and neither is knowing
      # about it — the cache key below is computed at *restore* time for exactly
      # this reason. It just also has to not reach the build.
      - name: Put the lockfile back
        run: git checkout -- Cargo.lock

      - name: Build the APK
        run: nix build .#apk-$VARIANT --print-build-logs

      - uses: actions/upload-artifact@v4
        with:
          name: harken-android-${{ env.VARIANT }}
          path: result/*.apk
          if-no-files-found: error

      # The key the *restore* computed, not a fresh one. `hashFiles` reads the
      # working tree, and cargo rewrites `Cargo.lock` in it — the step above
      # puts the file back, but only when `just` got that far. Taking the key
      # from the restore is true whatever happened in between; recomputing it
      # describes a lockfile that may exist nowhere in git, which is a key the
      # next run cannot ask for.
      #
      # `!cancelled()` rather than `always()`: a failed run's store is worth
      # keeping, a killed run's store is whatever it managed in the seconds it
      # had — and saving that is how the key got squatted.
      # A tag is a release, and a release is the APK — an artifact on a run
      # expires and cannot be linked to, which is the whole difference. Named
      # after the tag rather than gradle's `app-release.apk`, because the file
      # outlives the page it was downloaded from.
      - name: Name it after the tag
        if: startsWith(github.ref, 'refs/tags/v')
        run: cp result/*.apk harken-${{ github.ref_name }}.apk

      - uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/v')
        with:
          files: harken-${{ github.ref_name }}.apk
          fail_on_unmatched_files: true
          generate_release_notes: true
          body: |
            An Android build of harken. `adb install` it, or open it on the
            device.

            **Signed with Expo's debug keystore**, which is public — this is a
            build to try, not one to distribute. Anyone can re-sign it as this
            app, and Play will not take it. See `CLAUDE.md`.

      - uses: nix-community/cache-nix-action/save@v6
        if: ${{ !cancelled() }}
        with:
          primary-key: ${{ steps.nix-store-cache.outputs.primary-key }}
          gc-max-store-size-linux: 8G
          purge: true
          purge-prefixes: nix-${{ runner.os }}-
          purge-created: 0
          purge-primary-key: never
