# The Android build, built by nix.
#
# A branch push builds the development APK. The `Run workflow` button and a
# `v*` tag build the release one, which differs by a single gradle task.
#
# One job, on an x86_64 runner, which is worth saying plainly: everything Google
# publishes for Android is a `linux-x86_64` binary. Building this on the ARM
# machine it is developed on works — `binfmt_misc` and qemu see to that, and
# `CLAUDE.md` records what it costs — but here none of that applies and the
# toolchain simply runs.
#
# `nix build .#apk` rather than a sequence of steps, so that what CI builds and
# what a laptop builds are the same expression rather than two descriptions of
# one intention. Everything is pinned: the Rust toolchain, every crate, every
# npm package, the SDK, the NDK, CMake, gradle, and gradle's own Maven graph.
#
# And nothing relaxes the sandbox any more, which is the check on all of that.
# A fixed-output derivation still gets the network — that is how the vendoring
# fetches — but an ordinary one does not, so a build that quietly started
# reaching for something fails here rather than working on whoever's machine
# happened to have it.
name: android

on:
  push:
    branches: ["**"]
    # A version tag is a release build. Nothing else about the job changes:
    # same expression, same toolchain, one different gradle task.
    tags: ["v*"]
  pull_request:
  workflow_dispatch:
    inputs:
      variant:
        description: Which build to make
        type: choice
        options: [debug, release]
        default: debug

# A push supersedes the push before it, and a release build supersedes the
# release build before it — but a release build and a branch build are not the
# same work and must not cancel each other, which they did when the group was
# the ref alone: pressing the button killed the branch's build. `inputs.variant`
# is empty for anything that is not the button, so a push groups by event alone.
concurrency:
  group: android-${{ github.ref }}-${{ github.event_name }}-${{ inputs.variant }}
  cancel-in-progress: true

jobs:
  apk:
    runs-on: ubuntu-latest

    # `actions: write` is what lets the cache purge below delete anything. Run
    # 14 tried and logged "Failed to delete the cache", so the store caches were
    # accumulating while the one being kept was the wrong one.
    permissions:
      # `contents: write` to publish a release on a tag, `actions: write` so the
      # cache purge below can delete anything.
      contents: write
      actions: write

    # The button decides when it is pressed, a `v*` tag decides by existing, and
    # everything else is the development build — which is what a branch push
    # wants and what every run before this one made.
    env:
      VARIANT: ${{ inputs.variant || (startsWith(github.ref, 'refs/tags/v') && 'release') || 'debug' }}

    steps:
      - uses: actions/checkout@v4

      - uses: DeterminateSystems/nix-installer-action@main

      # The store is the expensive thing here: the NDK alone is over a gigabyte,
      # and the crates and npm packages are thousands of small fetches. Caching
      # it turns a cold twenty-minute setup into a warm one.
      #
      # Restore and save are separate steps because the combined action saves
      # from a post step declared `post-if: success()` — and a run that fails in
      # the APK step has still done the downloading this exists to keep.
      #
      # `@v7` rather than `@v6`, because under v6 this cache has never once been
      # restored. Every run downloaded three gigabytes and then failed to unpack
      # it — runs 29, 32 and 33 all end the same way:
      #
      #   Cache Size: ~3092 MB (3242205417 B)
      #   tar: /nix/nix-installer: Cannot open: File exists
      #   tar: /nix/store/…-gnumake-4.4.1.drv: Cannot open: Permission denied
      #   tar: /nix/store: Cannot utime: Operation not permitted
      #   tar: Exiting with failure status due to previous errors
      #   Failed to restore the cache.
      #
      # The installer above creates `/nix` as root before this step runs, and
      # tar then extracts over it as `runner`. So every build paid about ten
      # minutes rebuilding the SDK, the NDK, the vendored crates and both engine
      # layers, and another minute uploading a cache nothing could ever read.
      # v7 carries the fix for restoring over existing store paths, along with
      # checkpointing the store database before it is copied — which is the
      # other way a restore silently buys nothing.
      #
      # The run id is in the key because a GitHub cache key is immutable:
      # whoever writes it first owns it until it expires. A run cancelled ninety
      # seconds in wrote an 89MB empty store under the shared key, and every run
      # after it "restored" that and none could replace it. A key per run cannot
      # be squatted; the prefixes are what make it reusable, preferring the
      # newest run with this lockfile and falling back to any run at all.
      - uses: nix-community/cache-nix-action/restore@v7
        id: nix-store-cache
        with:
          primary-key: nix-${{ runner.os }}-${{ hashFiles('flake.lock', 'Cargo.lock', 'clients/expo/bun.lock') }}-${{ github.run_id }}
          restore-prefixes-first-match: |
            nix-${{ runner.os }}-${{ hashFiles('flake.lock', 'Cargo.lock', 'clients/expo/bun.lock') }}-
            nix-${{ runner.os }}-

      # The cheap check first, so a Rust mistake fails before the Android
      # toolchain has had its say — and as a derivation rather than a command
      # in a devshell, so it is the same expression here and on a laptop.
      #
      # `just` ran cargo against a `target/` that `Swatinem/rust-cache` kept
      # between runs, which is how run 37 failed on a pruned build script while
      # the identical command passed locally. A check keyed on its inputs
      # cannot drift like that, and when the inputs have not moved it does not
      # run at all: seventeen of the last twenty commits on main touched no
      # Rust at all.
      #
      # It also actually checks formatting. `just` runs `fmt` before `lint`, so
      # `cargo fmt --all` rewrote the tree and `cargo fmt --all --check` then
      # measured what it had just written.
      - name: fmt, clippy and the suite
        run: nix flake check --print-build-logs

      - name: Build the APK
        run: nix build .#apk-$VARIANT --print-build-logs

      - uses: actions/upload-artifact@v4
        with:
          name: harken-android-${{ env.VARIANT }}
          path: result/*.apk
          if-no-files-found: error

      # The key the *restore* computed, not a fresh one. Nothing in this job
      # runs cargo in the working tree any more, so `Cargo.lock` no longer
      # moves under it — but taking the key from the restore is true whatever
      # happens in between, and costs nothing.
      #
      # `!cancelled()` rather than `always()`: a failed run's store is worth
      # keeping, a killed run's store is whatever it managed in the seconds it
      # had — and saving that is how the key got squatted.
      # A tag is a release, and a release is the APK — an artifact on a run
      # expires and cannot be linked to, which is the whole difference. Named
      # after the tag rather than gradle's `app-release.apk`, because the file
      # outlives the page it was downloaded from.
      - name: Name it after the tag
        if: startsWith(github.ref, 'refs/tags/v')
        run: cp result/*.apk harken-${{ github.ref_name }}.apk

      - uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/v')
        with:
          files: harken-${{ github.ref_name }}.apk
          fail_on_unmatched_files: true
          generate_release_notes: true
          body: |
            An Android build of harken. `adb install` it, or open it on the
            device.

            **Signed with Expo's debug keystore**, which is public — this is a
            build to try, not one to distribute. Anyone can re-sign it as this
            app, and Play will not take it. See `CLAUDE.md`.

      # Root the layers worth caching, or the save step throws them away.
      #
      # It garbage-collects the store down to the cap before saving, and an
      # unrooted `nix store gc` keeps only what is reachable. The one root a
      # build leaves is `result` — the APK — whose runtime closure contains no
      # SDK, no NDK and no Rust at all. So run 36 restored a cache and then
      # rebuilt `androidsdk`, `harken-android-deps` and `harken-android-engine`
      # anyway, because the save before it had done this:
      #
      #   Current store size in bytes: 19686642592.
      #   Maximum allowed store size in bytes: 8589934592 (8G).
      #   nix store gc --max 11096708000
      #   1236 store paths deleted, 10.5 GiB freed
      #
      # These are the expensive halves of a build and the ones whose inputs
      # move least. `gradle9` is here because building it means building
      # ncurses from source: nixpkgs patchelfs the ncurses-linked libraries
      # bundled inside gradle's `native-platform` jars, which needs ncurses'
      # `dev` output — and Hydra never pushed that one, so the default and
      # `man` outputs being cached buys nothing. Substitution is per-output and
      # building is per-derivation.
      #
      # The three checks are here for a different reason: their outputs are
      # empty directories, so what gets cached is the fact that they passed —
      # which is the whole mechanism by which `nix flake check` skips them. An
      # unrooted empty output is unreachable and the collection takes it,
      # leaving the checks to run again on a commit that changed no Rust. An `--out-link` registers an indirect gc root, which is all
      # it takes for the collection to walk around them.
      - name: Keep the layers worth caching
        if: ${{ !cancelled() }}
        run: |
          for a in androidSdk expoModules ubrn androidDeps androidEngine \
                   gradle9 check-fmt check-clippy check-tests; do
            nix build -o "$RUNNER_TEMP/gcroot-$a" ".#$a" || true
          done
          # The vendored Maven mirror, which is not a package: it hangs off the
          # APK derivation as `mitmCache`, and 1642 artifacts is a lot to
          # re-materialise for want of one symlink.
          nix build -o "$RUNNER_TEMP/gcroot-maven" ".#apk-debug.mitmCache" || true

      - uses: nix-community/cache-nix-action/save@v7
        if: ${{ !cancelled() }}
        with:
          primary-key: ${{ steps.nix-store-cache.outputs.primary-key }}
          gc-max-store-size-linux: 12G
          purge: true
          purge-prefixes: nix-${{ runner.os }}-
          purge-created: 0
          purge-primary-key: never
