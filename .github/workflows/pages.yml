# The demo, published to GitHub Pages from a prebuilt site.
#
# **It is called `pages.yml` because it has to be.** A `workflow_dispatch`
# workflow is only dispatchable if a file of that name exists on the default
# branch — dispatching `pages-demo.yml` from here is a bare 404 — and what
# GitHub then runs is the version at the ref it was given. So this shadows
# `main`'s `pages.yml` for a dispatch against this branch and leaves it
# untouched for every push to `main`.
#
# **Why it does not simply do what that one does.** `main`'s is the right
# shape: `nix build .#harken-demo`, so what is published is built the
# way a contributor builds it. It cannot build the libcosmic branch, because
# there `Cargo.toml` says `libcosmic = { path = "../libcosmic" }` — a working
# copy carrying patches to libcosmic *and* to its vendored `iced` submodule,
# which exists on one machine and on no runner. Until that is a fork pinned by
# git rev the way petros is, nothing on CI can compile that branch at all.
#
# So this branch carries the *output*: `index.html`, `favicon.svg` and the
# `pkg/` wasm-bindgen produced, committed rather than built. That is a worse
# thing than `pages.yml` in every way except the one that matters here — it
# can actually run. It is an orphan branch so none of it reaches `main`'s
# history, and the moment the fork exists this file and this branch should
# both be deleted.
#
# One site per repository, so a run of this replaces whatever `main` last
# published, and the next push to `main` replaces this. That is Pages, not a
# policy.
#
# **It needs one setting changed, and nothing here can change it.** The
# `github-pages` environment restricts deployments to the default branch, so a
# dispatch against this one is rejected in about a second, before a runner is
# assigned and therefore with no logs at all to read. Falsified rather than
# assumed: run 85 carried the `environment:` block below and died that way;
# run 86 was the same file with that block and the deploy step removed, and it
# ran its steps and uploaded the artifact. So the branch may run workflows and
# may build the site; it may not deploy one.
#
# Settings -> Environments -> github-pages -> Deployment branches: add
# `demo-site`, or allow all branches. Then dispatch this against `demo-site`.
name: pages

on:
  workflow_dispatch:

concurrency:
  group: pages
  cancel-in-progress: false

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      # The site is the branch, minus the workflow that publishes it.
      - name: Gather the site
        run: |
          mkdir -p site
          cp -r index.html favicon.svg pkg site/
          du -sh site
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deploy
        uses: actions/deploy-pages@v4
