# The demo, published to GitHub Pages.
#
# The iced client compiled to wasm with `--features demo`: no server, no
# sign-in, and a seeded library, so the page is the thing itself rather than a
# screenshot of it. A separate build from the real client rather than a runtime
# flag — a flag can be set by accident, a feature has to be asked for.
#
# Nix does the same job here it does locally. The toolchain, the wasm target and
# `wasm-bindgen` all come out of the flake and the lockfile, so what is
# published is built the way a contributor builds it.
name: pages

on:
  push:
    branches: [main]
    paths:
      - "domain/**"
      - "iced/**"
      - "Cargo.*"
      - "flake.*"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

# One deployment at a time, and let a run in progress finish: cancelling a
# half-done deploy is how a site ends up serving nothing.
concurrency:
  group: pages
  cancel-in-progress: false

permissions:
  contents: read
  pages: write
  id-token: write
  # …and `actions: write`, which is what lets the purge below delete anything.
  # Without it the purge logs "Failed to delete the cache" and the old ones
  # accumulate against a quota this repository has no room to spare.
  actions: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: DeterminateSystems/nix-installer-action@main
      # The run id is in the key because a GitHub cache key is immutable:
      # whoever writes it first owns it until it expires. Without it the first
      # run for a given lockfile owns that key forever — so a run cancelled
      # thirty seconds in writes an empty store under it and every run after
      # that "restores" nothing and cannot replace it. `android.yml` learned
      # this the same way and the shape here is its shape: a key per run, made
      # reusable by the prefixes, preferring the newest run with this lockfile
      # and falling back to any run at all.
      - uses: nix-community/cache-nix-action/restore@v7
        id: nix-store-cache
        with:
          primary-key: pages-${{ runner.os }}-${{ hashFiles('flake.lock', 'Cargo.lock') }}-${{ github.run_id }}
          restore-prefixes-first-match: |
            pages-${{ runner.os }}-${{ hashFiles('flake.lock', 'Cargo.lock') }}-
            pages-${{ runner.os }}-

      - name: Build the demo
        run: nix build .#harken-demo --print-build-logs

      # `result` is a store path and a symlink; Pages wants a directory it can
      # read, and the store is read-only.
      - name: Copy it out of the store
        run: |
          mkdir -p site
          cp -rL result/. site/
          chmod -R u+w site

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

      # **A run whose build fails cannot save its store, and says so as a
      # warning.**
      #
      # `cache-nix-action` saves the store by handing the paths to `tar`, and
      # nix holds a `<derivation>.lock` in the store for a build in progress.
      # It is mode 0600 and owned by root, so tar cannot open one — and tar
      # does not skip what it cannot read, it exits 2:
      #
      #   tar: /nix/store/…-harken-cargo-vendor.lock: Cannot open: Permission denied
      #   tar: /nix/store/…-wasm-bindgen-cli-0.2.128.lock: Cannot open: Permission denied
      #   tar: Exiting with failure status due to previous errors
      #   ##[warning]Cache save failed.
      #
      # Which run this bites is the part worth knowing. A build that *finishes*
      # releases its locks, so a green run saves fine and this step is a no-op
      # for it — run 56 did, without the step existing. A build that **fails**
      # leaves the lock of whatever it died in the middle of, and that is
      # precisely the run whose store is worth keeping: the next push is
      # usually the fix, and without the save it rebuilds from nothing
      # everything the failed run had already built. Run 55 died on a vendor
      # hash and left the two locks above; run 56 then found no cache at all
      # and spent 5m40s where run 58 spends 3m33s.
      #
      # It fails as a *warning*, so the job's own conclusion says nothing about
      # it, and on a run that is already red there is no reason to look.
      # `android.yml` has carried this step since it hit the same thing. They
      # are transient locks and nothing outlives the job that made them.
      # Root the layers worth caching, or the gc below throws them away — the
      # same reason `android.yml` has this step, and the same failure: the one
      # root a build leaves is `result`, whose closure is the published page
      # and contains no Rust at all. The cap has not bitten yet because the
      # store comes out under it; the day it does, an unrooted store is
      # collected down to the site and the cache saved is worth nothing.
      - name: Keep the layers worth caching
        if: ${{ !cancelled() }}
        run: |
          for a in rust-toolchain cargo-vendor wasm-bindgen-cli harken-demo; do
            nix build -o "$RUNNER_TEMP/gcroot-$a" ".#$a" || true
          done

      - name: Drop nix's build locks so the store can be tarred
        if: ${{ !cancelled() }}
        run: sudo rm -f /nix/store/*.lock

      # `!cancelled()` rather than `always()`, for the reason the key has a run
      # id in it: a killed run's store is whatever it managed in the seconds it
      # had, and saving that is how a key gets squatted.
      #
      # `purge` keeps exactly one of these. Two workflows share this
      # repository's 10 GB cache quota and `android` alone saves about 8.5 GB
      # of it, so a second `pages-` cache lying around is the difference
      # between both fitting and both being evicted.
      - uses: nix-community/cache-nix-action/save@v7
        if: ${{ !cancelled() }}
        with:
          primary-key: ${{ steps.nix-store-cache.outputs.primary-key }}
          gc-max-store-size-linux: 8G
          purge: true
          purge-prefixes: pages-${{ runner.os }}-
          purge-created: 0
          purge-primary-key: never

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4
