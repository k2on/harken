[workspace]
resolver = "2"
members = [
    "crates/harken",
    "crates/harken-wasm",
    "crates/ffi",
    "crates/server",
    "clients/iced",
]

[workspace.package]
edition = "2021"
license = "MIT"
# The oldest toolchain that builds the dependency tree. Nothing here needs it
# directly; it comes in under `petros`, whose SQLite layer pulls diesel_derives
# and so darling. Verified by building and testing the workspace on exactly
# this version.
rust-version = "1.88"

[workspace.dependencies]
ciborium = "0.2"
# The engine, by git rather than by path.
#
# Not a preference: EAS archives this repository and nothing beside it, so a
# `../petros` would not exist in the build container. A git dependency resolves
# the same on a laptop and on a builder.
#
# `.cargo/config.toml` patches these back to the working copy next door, so day
# to day this still builds from the checkout and picks up edits without a
# commit. That file is gitignored, which is what makes a fresh clone — and EAS —
# get the committed engine instead.
petros = { git = "https://github.com/k2on/petros", branch = "typed-writes" }
petros-wasm-host = { git = "https://github.com/k2on/petros", branch = "typed-writes" }
petros-schema = { git = "https://github.com/k2on/petros", branch = "typed-writes" }
petros-sql = { git = "https://github.com/k2on/petros", branch = "typed-writes" }
petros-testkit = { git = "https://github.com/k2on/petros", branch = "typed-writes" }
petros-wasm-guest = { git = "https://github.com/k2on/petros", branch = "typed-writes" }
petros-axum = { git = "https://github.com/k2on/petros", branch = "typed-writes" }
# `default-features = false` here so `crates/harken-wasm` can actually turn the
# storage half off — a member's `default-features = false` is ignored unless the
# workspace dependency says so too, silently, which put SQLite in a wasm build
# that has none.
harken = { path = "crates/harken", default-features = false }
# `fira-sans` embeds a default font. Without it iced asks the system for
# one, which works on a desktop and gets you nothing at all in a browser:
# wasm has no font access, so every glyph silently fails to draw.
iced = { version = "0.14", features = ["fira-sans"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "1"
# Pinned exactly: `uniffi-bindgen-react-native` pins `uniffi = "=0.31"`, and the
# generator and the runtime must agree on the metadata format or the bindings
# it emits will not match the library it read them from.
uniffi = "=0.31"

[profile.test]
opt-level = 1

# wasmi's interpreter is stack-hungry when it is not optimised — enough that the
# mutator tests overflowed a default 2MB thread stack before this line existed.
# That is a property of the build, not of the module: the same wasm runs in a
# fraction of the stack once the interpreter is optimised, which is what every
# real peer ships. Optimising dependencies here keeps the tests honest about
# what the phone will actually do.
[profile.test.package."*"]
opt-level = 2

# `just iced` runs a `dev` build, and iced is not a library you only compile:
# every frame goes through its text shaping and its rasteriser. Unoptimised,
# that is slow enough to feel while scrolling. Dependencies change rarely, so
# optimise them and leave this workspace's own crates at `opt-level = 0`, where
# an edit still rebuilds in a second.
[profile.dev.package."*"]
opt-level = 2

# The mutator module: rebuilt on every save, pushed over Metro, interpreted on
# the other end. Measured across the profile space on this machine, three
# incremental rebuilds each:
#
#     opt   cgu    rebuild     size
#     "z"    1      0.84s    149,140     smallest, but nearly twice the wait
#     "z"   16      0.46s    166,355  <- both, so this one
#     "s"   16      0.48s    184,701
#       1   16      0.46s    210,360
#       2   16      0.52s    190,768
#
# `codegen-units = 1` is the usual reflex for a small wasm artifact and it is
# the wrong call here: it buys 17KB nobody will notice over a LAN and costs
# 0.38s on a loop measured in single seconds. `lto` is off for the same reason.
[profile.mutators]
inherits = "release"
opt-level = "z"
lto = false
panic = "abort"
codegen-units = 16
strip = true
