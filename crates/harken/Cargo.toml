[package]
name = "harken"
version = "0.1.0"
description = "The demo to-do domain: apply and fill_auto once, plus the read model and the native host."
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[features]
# The read model and the `petros::App` — everything that needs a
# real SQLite. The wasm build turns this off: it has no SQLite of its own, only
# a channel to the host's, so it wants `domain` and `schema` and nothing else.
default = ["storage"]
# `petros-schema/author` belongs here and not on the dependency line: features
# are unified per target, so asking for it there would put serde_json and uuid
# in the wasm module even though `default-features = false` turns this whole
# feature off. Checked with `cargo tree -p harken-wasm`.
storage = ["dep:petros", "dep:serde", "dep:serde_json", "petros-schema/author"]
# A transport, for a client that runs. The domain itself has no opinion about
# sockets and neither does the engine.
ws = ["storage", "petros/ws"]

[dependencies]
ciborium.workspace = true
petros-schema = { workspace = true, features = ["cbor"] }
petros-sql.workspace = true
petros = { workspace = true, optional = true }
serde = { workspace = true, optional = true }
serde_json = { workspace = true, optional = true }

# The demo peers. They live with the domain rather than with the engine: they
# are programs that use an app, and `petros` has no idea what a to-do is.
[dev-dependencies]
# The app tests its own domain the way the engine tests itself: two builds of
# one `apply` compared row by row, and a simulated fleet it has to converge on.
petros-wasm-host.workspace = true
petros-testkit.workspace = true
ciborium.workspace = true
serde_json.workspace = true
