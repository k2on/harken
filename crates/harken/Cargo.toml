[package]
# `heart.rs` is a module the iced example includes, not an example of its own.
autoexamples = false
name = "harken"
version = "0.1.0"
description = "The demo to-do domain: apply and fill_auto once, plus the read model and the native host."
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[features]
# The read model, the Diesel host and the `petros::App` — everything that needs a
# real SQLite. The wasm build turns this off: it has no SQLite of its own, only
# a channel to the host's, so it wants `domain` and `schema` and nothing else.
default = ["storage"]
storage = ["dep:diesel", "dep:petros", "dep:serde", "dep:serde_json"]
# A transport, for the example peers. The domain itself has no opinion about
# sockets and neither does the engine; only a program that runs does.
ws = ["storage", "petros/ws"]

[dependencies]
ciborium.workspace = true
petros-schema = { workspace = true, features = ["cbor"] }
petros-sql.workspace = true
diesel = { workspace = true, optional = true }
petros = { workspace = true, optional = true }
serde = { workspace = true, optional = true }
serde_json = { workspace = true, optional = true }

# The demo peers. They live with the domain rather than with the engine: they
# are programs that use an app, and `petros` has no idea what a to-do is.
[dev-dependencies]
# The app tests its own domain the way the engine tests itself: two builds of
# one `apply` compared row by row, and a simulated fleet it has to converge on.
petros-wasm-host.workspace = true
petros-testkit.workspace = true
ciborium.workspace = true
serde_json.workspace = true
diesel = { workspace = true, features = ["sqlite"] }

[target.'cfg(not(target_arch = "wasm32"))'.dev-dependencies]
# `smol` gives iced a timer to drive the example's transport pump. In a browser
# it already has one.
# `canvas` because the heart is a path: Fira Sans has no U+2665, so the
# character would draw nothing at all.
iced = { workspace = true, features = ["smol", "canvas"] }

# The iced example in a browser: a panic that reaches the console beats one that
# reports "unreachable executed".
[target.'cfg(target_arch = "wasm32")'.dev-dependencies]
console_error_panic_hook = "0.1"
# WebGL rather than WebGPU, for reach. Without it wgpu finds no backend, iced
# falls back to its software renderer, and that cannot have the canvas because
# WebGL already claimed it — which surfaces as a blank page and a panic about
# canvas contexts.
iced = { workspace = true, features = ["webgl", "canvas"] }

[[example]]
name = "iced"
required-features = ["ws"]
