[package]
name = "harken-server"
version = "0.1.0"
description = "The Harken sync server: an axum service with a Petros endpoint mounted on it."
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
axum = "0.8"
harken = { workspace = true, features = ["storage"] }
petros.workspace = true
petros-axum.workspace = true
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "signal"] }
# Static files, for serving the browser client from the same port as the socket.
# `fs` only: no compression, no tracing, no cors — the point is a handler beside
# the sync one, not a web framework.
tower-http = { version = "0.6", features = ["fs"] }
