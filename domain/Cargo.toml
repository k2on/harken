[package]
name = "harken"
version = "0.1.0"
description = "The demo to-do domain: apply and fill_auto once, plus the read model and the native host."
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[features]
# The read model and the `petros::App` — everything that needs a
# real SQLite. The wasm build turns this off: it has no SQLite of its own, only
# a channel to the host's, so it wants `domain` and `schema` and nothing else.
default = ["storage"]
# `petros-schema/author` belongs here and not on the dependency line: features
# are unified per target, so asking for it there would put serde_json and uuid
# in the wasm module even though `default-features = false` turns this whole
# feature off. Checked with:
#   cargo tree -p harken --no-default-features -e normal --target wasm32-unknown-unknown
# `-e normal` because dev-dependencies pull in the engine and never ship.
storage = ["dep:petros", "dep:serde", "dep:serde_json", "petros-schema/author"]
# A transport, for a client that runs. The domain itself has no opinion about
# sockets and neither does the engine.
ws = ["storage", "petros/ws"]
# The client a foreign caller sees, over UniFFI. Off by default: it is one
# client's binding layer, and the desktop client and the server should not build
# uniffi or a wasm interpreter to reach the same domain.
#
# The name is not free: `petros_schema::row!` generates its `foreign` module
# behind `#[cfg(feature = "foreign")]`, evaluated in this crate.
#
# Proc-macro mode, so there is no UDL file — `src/foreign_client.rs` *is* the
# interface definition, which is the point: no second place to keep in step.
foreign = ["storage", "dep:petros-wasm-host", "dep:thiserror", "dep:uniffi"]

[lib]
# Three, and each is load-bearing. `rlib` is what other crates link. `cdylib` is
# the module the phone loads over Metro. `staticlib` is what `ubrn build android`
# copies into jniLibs — dropping it when the FFI crate was folded in here is what
# broke CI with "libharken.a does not exist".
#
# Cargo has no per-target crate-type, so all three are listed unconditionally.
# That costs nothing as a dependency: other crates take the rlib, and the extra
# links happen only when this package is built directly.
crate-type = ["rlib", "cdylib", "staticlib"]

[dependencies]
ciborium.workspace = true
petros-schema = { workspace = true, features = ["cbor"] }
petros-sql.workspace = true
petros = { workspace = true, optional = true }
serde = { workspace = true, optional = true }
serde_json = { workspace = true, optional = true }

# The demo peers. They live with the domain rather than with the engine: they
# are programs that use an app, and `petros` has no idea what a to-do is.
# Only the wasm build has an ABI to export, and only it should pay for the
# guest.
petros-wasm-host = { workspace = true, optional = true }
thiserror = { workspace = true, optional = true }
uniffi = { workspace = true, optional = true }

[target.'cfg(target_arch = "wasm32")'.dependencies]
petros-wasm-guest.workspace = true

# The client tests need the feature they test; cargo has no way to say that on
# a test target, so `harken test` passes --all-features and this is why.
[dev-dependencies]
# The app tests its own domain the way the engine tests itself: two builds of
# one `apply` compared row by row, and a simulated fleet it has to converge on.
petros-wasm-host.workspace = true
petros-testkit.workspace = true
ciborium.workspace = true
serde_json.workspace = true
