[package]
name = "harken-server"
version = "0.1.0"
description = "The Harken sync server: an axum service with a Petros endpoint mounted on it."
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
axum = "0.8"
harken = { workspace = true, features = ["storage"] }
petros.workspace = true
petros-axum.workspace = true
# Signing in: the OpenID Connect relying party and the sessions it issues.
petros-auth = { workspace = true, features = ["server"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "signal"] }
# Static files, for serving the browser client from the same port as the socket.
# `fs` only: no compression, no tracing, no cors — the point is a handler beside
# the sync one, not a web framework.
tower-http = { version = "0.6", features = ["fs"] }
# The library scanner. `lofty` reads the tags out of a file — a scanner that
# guessed them from the path would be wrong for every library that is not laid
# out the way it expected. `notify` is the watch, so a file added after boot
# does not wait for a rescan that may never come.
lofty = "0.25"
notify = { version = "8", default-features = false, features = ["macos_fsevent"] }
