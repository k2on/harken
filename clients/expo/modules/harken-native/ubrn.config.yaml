# How the generated turbo-module is wired to the Rust.
#
# `rust.directory` points back at this repository's cargo workspace, and the
# crate below is the domain crate itself — not a vendored copy and not a wrapper
# package. That is the whole point: the mutations and the queries have one
# definition, and everything a foreign caller sees is generated from it.
#
# `cargoExtras: --features foreign` is what makes that possible. The binding layer
# is a feature of the domain crate rather than a crate of its own, and it is off
# by default so the desktop client and the server do not build uniffi and a wasm
# interpreter to reach the same `apply`.
---
rust:
  directory: ../../../..
  manifestPath: crates/harken/Cargo.toml

bindings:
  cpp: cpp/generated
  ts: src/generated

android:
  directory: android
  # arm64 covers every device made this decade; x86_64 is what an emulator on a
  # normal laptop runs. Add armeabi-v7a and x86 here if you need older hardware.
  targets:
    - arm64-v8a
    - x86_64
  apiLevel: 24
  cargoExtras:
    - --features
    - foreign

ios:
  directory: ios
  targets:
    - aarch64-apple-ios
    - aarch64-apple-ios-sim
  cargoExtras:
    - --features
    - foreign
