# How the generated turbo-module is wired to the Rust.
#
# `rust.directory` points back at this repository's cargo workspace: the crate
# below is the same one `cargo test` builds, not a vendored copy. That is the
# whole point — the mutations and the queries have one definition, in
# `crates/harken`, and everything a foreign caller sees is generated from it.
---
rust:
  directory: ../../../..
  manifestPath: clients/expo/rust/Cargo.toml

bindings:
  cpp: cpp/generated
  ts: src/generated

android:
  directory: android
  # arm64 covers every device made this decade; x86_64 is what an emulator on a
  # normal laptop runs. Add armeabi-v7a and x86 here if you need older hardware.
  targets:
    - arm64-v8a
    - x86_64
  apiLevel: 24

ios:
  directory: ios
  targets:
    - aarch64-apple-ios
    - aarch64-apple-ios-sim
