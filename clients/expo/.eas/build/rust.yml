# Building the Rust before EAS builds the app.
#
# EAS runs `eas build` on its own workers, which carry the Android SDK, the NDK
# and node — but not Rust, and not our nix devshell. So the toolchain is
# installed here from `rust-toolchain.toml`, which is still the one place a
# version or a target is named: rustup reads that file directly, exactly as
# `nix develop` does through rust-overlay.
#
# Two Rust artifacts are produced, and they are not the same kind of thing:
#
#   the engine   cross-compiled per ABI and linked into the app. Changing it
#                means a new build, which is what this file is for.
#   the mutators one wasm module, carried in the JS bundle. Changing it does
#                *not* need a build — that is the point of the arrangement, and
#                it is why this file should run rarely.
build:
  name: Rust for Android
  steps:
    - eas/checkout

    - run:
        name: Install Rust from rust-toolchain.toml
        command: |
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs \
            | sh -s -- -y --default-toolchain none --profile minimal
          . "$HOME/.cargo/env"
          # `rustup show` provisions exactly what the file asks for: the
          # channel, the components and every target, Android and wasm alike.
          rustup show active-toolchain || rustup show
          cargo install cargo-ndk --locked --version ^3
          echo "$HOME/.cargo/bin" >> "$EAS_BUILD_PATH"

    - eas/install_node_modules

    - run:
        name: Build the mutator module
        command: |
          . "$HOME/.cargo/env"
          cargo build -p todo-wasm --target wasm32-unknown-unknown --profile mutators
          cargo run -q -p exo-todo-ffi --bin emit-mutators

    - run:
        name: Build the engine and generate the turbo module
        command: |
          . "$HOME/.cargo/env"
          cd clients/expo/modules/exo-todo
          ../../node_modules/.bin/ubrn build android \
            --config ubrn.config.yaml --and-generate --release

    - eas/prebuild
    - eas/build_android_app
    - eas/upload_artifact
