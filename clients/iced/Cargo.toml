[package]
name = "exo-iced-demo"
version = "0.1.0"
description = "The same to-do list as the examples, in iced, on the desktop and in a browser."
edition.workspace = true
license.workspace = true
rust-version.workspace = true

# cdylib for the browser (wasm-bindgen needs it), rlib so the desktop binary
# can link the same code.
[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
diesel.workspace = true
exo = { path = "../../crates/exo" }
iced.workspace = true
serde.workspace = true

# Browser. `exo` brings the SQLite; this is the rest of what a wasm build needs.
[target.'cfg(target_arch = "wasm32")'.dependencies]
console_error_panic_hook = "0.1"
getrandom = { version = "0.2", features = ["js"] }
iced = { workspace = true, features = ["webgl"] }
wasm-bindgen = "0.2"
