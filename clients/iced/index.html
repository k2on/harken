<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>exo · to-do</title>
    <style>
      html, body { margin: 0; height: 100%; background: #fff; font-family: system-ui, sans-serif; }
      /* iced appends its canvas to <body> and sizes it to 100%. */
      canvas { display: block; }
      #boot { padding: 24px; color: #555; }
    </style>
  </head>
  <body>
    <p id="boot">loading exo…</p>
    <script type="module">
      import init, { exo_self_test } from "./pkg/exo_iced_demo.js";
      // The wasm module's `start` runs the app; drop the placeholder once it has.
      await init();
      document.getElementById("boot")?.remove();
      // `?selftest` drives Exo directly and prints the result, so the engine can
      // be checked in a browser without depending on anything rendering.
      if (location.search.includes("selftest")) {
        console.log("EXO_SELF_TEST " + exo_self_test());
      }
    </script>
  </body>
</html>
