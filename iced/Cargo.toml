[package]
name = "harken-iced"
version = "0.1.0"
description = "The desktop and browser client: the same domain the phone runs, in a window."
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[features]
# A standalone demo: no server, no sign-in, a seeded library. What is published
# to GitHub Pages, and a separate binary from the real client on purpose — a
# flag could be set by accident, a feature has to be asked for at build time.
demo = []

[dependencies]
harken = { workspace = true, features = ["storage"] }
petros = { workspace = true, features = ["ws"] }
# Signing in: a loopback listener and the browser on the desktop, the
# page's own address in a browser.
petros-auth = { workspace = true, features = ["client"] }
# The remembered login, as a file on the desktop and a storage item in a browser.
serde_json.workspace = true

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
# `smol` gives iced a timer to drive the transport pump. In a browser it
# already has one.
#
# `canvas` because the heart is a path: Fira Sans, which iced embeds, has no
# U+2665, so the character would lay out fine and draw nothing at all.
iced = { workspace = true, features = ["smol", "svg", "advanced"] }

# In a browser: a panic that reaches the console beats one that reports
# "unreachable executed".
[target.'cfg(target_arch = "wasm32")'.dependencies]
console_error_panic_hook = "0.1"
# `HtmlAudioElement` is the now-playing bar: handing a URL to the platform
# buys streaming, buffering, range requests and seeking, none of which are
# worth writing again in Rust. `Document` and `Element` are what it takes to
# make one.
web-sys = { version = "0.3", features = [
  "Window",
  "History",
  "Location",
  "Document",
  "Element",
  "HtmlAudioElement",
  "HtmlMediaElement",
  # The listening session's socket, at `/listen`. Text frames rather than the
  # engine's CBOR, so no `BinaryType` here.
  "WebSocket",
  "MessageEvent",
] }
wasm-bindgen = "0.2"
# WebGL rather than WebGPU, for reach. Without it wgpu finds no backend, iced
# falls back to its software renderer, and that cannot have the canvas because
# WebGL already claimed it — which surfaces as a blank page and a panic about
# canvas contexts.
iced = { workspace = true, features = ["webgl", "svg", "advanced"] }
