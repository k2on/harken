<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>harken</title>
    <!-- Generated from `branding/`, and it carries both themes itself: a tab
         strip is light or dark and the page is never told which. That is also
         why the splash below can draw it as an ordinary <img> — an SVG loaded
         that way still resolves its own `prefers-color-scheme`, so the mark is
         the right gold on either page without this file naming a colour. -->
    <link rel="icon" href="favicon.svg" type="image/svg+xml" />
    <style>
      /* iced picks light or dark from the system; the page behind it has to
         agree, or a dark window is loaded over a white flash and the boot
         line is black on black. `color-scheme` makes the default canvas and
         text follow the same preference the app is reading. */
      html, body {
        margin: 0;
        height: 100%;
        color-scheme: light dark;
        font-family: system-ui, sans-serif;
      }
      /* iced appends its canvas to <body> and sizes it to 100%. */
      canvas { display: block; }

      /* The splash covers the canvas rather than the canvas starting
         invisible, so a wasm module that never resolves leaves a page saying
         "loading" instead of a blank one saying nothing. `Canvas` is the CSS
         system colour `color-scheme` above already resolves — the one
         background this file can name without writing down a colour that
         belongs to `branding/`. */
      #boot {
        position: fixed;
        inset: 0;
        z-index: 1;
        display: grid;
        place-items: center;
        background: Canvas;
        transition: opacity 320ms ease-out, transform 320ms ease-out;
      }
      #boot img {
        width: 96px;
        height: 96px;
        animation: settle 420ms ease-out both;
      }
      /* It goes the same way the app comes, and only barely — this is a
         cross-fade into the app, not a lid coming off it. */
      #boot.done {
        opacity: 0;
        transform: scale(1.04);
        pointer-events: none;
      }

      /* The app arrives the way Linear's does and the way a Hyprland login
         does: it grows the last ten percent into place as the splash fades
         through it. A fade alone reads as a picture being turned up; the
         scale is what makes it an arrival. */
      canvas.arriving {
        animation: arrive 900ms ease-out both;
      }
      /* **Most of the travel has to happen after the splash has gone**, and
         getting that wrong is invisible rather than wrong-looking. The first
         version ran 620ms of `cubic-bezier(0.33, 1, 0.68, 1)` against a 420ms
         fade, so at the moment you could first see the canvas it was already
         at 0.98 of 1 — the zoom was real, measurable, and entirely behind an
         opaque splash. 900ms of plain `ease-out` against a 320ms fade leaves
         about four percent of scale still to run in plain view, which is what
         you actually watch. The opacity is over by 320ms to match the fade,
         so the two cross rather than the app arriving under a hole. */
      @keyframes arrive {
        from { opacity: 0; transform: scale(0.9); }
        36%  { opacity: 1; }
        to   { opacity: 1; transform: none; }
      }
      @keyframes settle {
        from { opacity: 0; transform: scale(0.94); }
        to   { opacity: 1; transform: none; }
      }

      /* Somebody who has asked for less motion still gets the fade, because
         the thing it is saying — "this is ready now" — is not decoration. */
      @media (prefers-reduced-motion: reduce) {
        #boot, #boot img, canvas.arriving { animation: none; transition: opacity 160ms linear; }
        #boot.done { transform: none; }
      }
    </style>
  </head>
  <body>
    <div id="boot"><img src="favicon.svg" alt="harken" /></div>
    <script type="module">
      import init from "./pkg/harken-iced.js";
      // The wasm module's `start` runs the app; take the splash down once it
      // has, and not before — the canvas is painting underneath the whole
      // time, so this is a reveal rather than a load.
      await init();

      const boot = document.getElementById("boot");
      // A transform on a canvas moves the box winit reads the pointer out of,
      // so the class is dropped the moment the animation is over and clicks
      // land exactly where they did before. Nobody is clicking during it.
      const arrive = (canvas) => {
        canvas.classList.add("arriving");
        canvas.addEventListener(
          "animationend",
          () => canvas.classList.remove("arriving"),
          { once: true },
        );
      };
      // `transitionend` does not fire when the transition is suppressed —
      // reduced motion, a background tab — so the timeout is the one that has
      // to be there, and whichever lands first wins.
      const dismiss = () => {
        boot?.classList.add("done");
        boot?.addEventListener("transitionend", () => boot.remove(), { once: true });
        setTimeout(() => boot?.remove(), 800);
      };

      // The keyboard only reaches the app while its canvas has the focus, and
      // a freshly loaded page focuses <body> — so `j` did nothing at all until
      // something had been clicked. iced gives the canvas `tabindex=0`, so it
      // can take focus; it just has to be told to. Focused on arrival and
      // again whenever the window comes back, which is what a reader who
      // alt-tabs away and types `j` expects.
      const grab = () => document.querySelector("canvas")?.focus();
      addEventListener("focus", grab);

      // Once, on the canvas — the window `focus` listener above must not
      // replay the animation every time somebody alt-tabs back.
      const ready = (canvas) => {
        grab();
        arrive(canvas);
        dismiss();
      };

      // The canvas is appended by the wasm module, so it may not exist yet on
      // the first try. One observer, disconnected as soon as it has one.
      const canvas = document.querySelector("canvas");
      if (canvas) {
        ready(canvas);
      } else {
        const watch = new MutationObserver(() => {
          const late = document.querySelector("canvas");
          if (late) {
            ready(late);
            watch.disconnect();
          }
        });
        watch.observe(document.body, { childList: true });
      }
    </script>
  </body>
</html>
