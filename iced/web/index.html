<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>harken</title>
    <!-- Generated from `branding/`, and it carries both themes itself: a tab
         strip is light or dark and the page is never told which. -->
    <link rel="icon" href="favicon.svg" type="image/svg+xml" />
    <style>
      /* iced picks light or dark from the system; the page behind it has to
         agree, or a dark window is loaded over a white flash and the boot
         line is black on black. `color-scheme` makes the default canvas and
         text follow the same preference the app is reading. */
      html, body {
        margin: 0;
        height: 100%;
        color-scheme: light dark;
        font-family: system-ui, sans-serif;
      }
      /* iced appends its canvas to <body> and sizes it to 100%. */
      canvas { display: block; }
      #boot { padding: 24px; opacity: 0.6; }
    </style>
  </head>
  <body>
    <p id="boot">loading harken…</p>
    <script type="module">
      import init from "./pkg/harken-iced.js";
      // The wasm module's `start` runs the app; drop the placeholder once it has.
      await init();
      document.getElementById("boot")?.remove();

      // The keyboard only reaches the app while its canvas has the focus, and
      // a freshly loaded page focuses <body> — so `j` did nothing at all until
      // something had been clicked. iced gives the canvas `tabindex=0`, so it
      // can take focus; it just has to be told to. Focused on arrival and
      // again whenever the window comes back, which is what a reader who
      // alt-tabs away and types `j` expects.
      const grab = () => document.querySelector("canvas")?.focus();
      grab();
      addEventListener("focus", grab);
      // The canvas is appended by the wasm module, so it may not exist yet on
      // the first try. One observer, disconnected as soon as it has one.
      if (!document.querySelector("canvas")) {
        const watch = new MutationObserver(() => {
          if (document.querySelector("canvas")) {
            grab();
            watch.disconnect();
          }
        });
        watch.observe(document.body, { childList: true });
      }
    </script>
  </body>
</html>
